meta:
  Type: Analysis
  ID: kri0001
  GroupLevel: Site
  Abbreviation: AE
  Metric: "Adverse Event Rate"
  Numerator: "Adverse Events"
  Denominator: "Days on Study"
  Model: "Normal Approximation"
  Score: "Adjusted Z-Score"
  AnalysisType: rate
  Priority: 2
spec:
  Mapped_AE:
    SubjectID:
      type: character
  Raw_DM:
    SubjectID:
      type: character
    SiteID:
      type: character
    DaysOnStudy:
      type: integer
steps:
  - output: Analysis_Input
    name: gsm.core::Input_Rate
    params:
      dfSubjects: Raw_DM
      dfNumerator: Mapped_AE
      dfDenominator: Raw_DM
      strSubjectCol: SubjectID
      strGroupCol: SiteID
      strGroupLevel: GroupLevel
      strDenominatorMethod: Sum
      strDenominatorCol: DaysOnStudy
  - output: Analysis_Transformed
    name: gsm.core::Transform_Rate
    params:
      dfInput: Analysis_Input
  - output: Analysis_Analyzed
    name: gsm.core::Analyze_NormalApprox
    params:
      dfTransformed: Analysis_Transformed
      strType: rate
  - output: Analysis_Flagged
    name: gsm.core::Flag
    params:
      dfAnalyzed: Analysis_Analyzed
  - output: Analysis_Summary
    name: gsm.core::Summarize
    params:
      dfFlagged: Analysis_Flagged
